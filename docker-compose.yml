# Full self-hosted stack: API + worker + Postgres + Redis, shared result volume.
services:
  api:
    build: .
    env_file: .env
    environment: &common
      DATABASE_URL: postgresql+psycopg://media:media@db:5432/media_api
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_DIR: /code/data/results
    ports:
      - "8000:8000"
    volumes:
      - results:/code/data/results
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    env_file: .env
    environment: *common
    command: ["python", "-m", "app.worker"]
    volumes:
      - results:/code/data/results
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  results:
